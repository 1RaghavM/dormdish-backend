[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mealplanner"
version = "0.1.0"
description = "Deterministic meal planning engine with CP-SAT optimizer"
authors = [{name = "DormDish AI"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110,<0.115",
    "or-tools>=9.9,<9.11",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0"
]

[project.optional-dependencies]
tests = [
    "pytest>=8.2,<8.3",
    "httpx>=0.27,<0.28"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]