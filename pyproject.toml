[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mealplanner"
version = "0.1.0"
description = "Deterministic meal planning engine with CP-SAT optimizer"
authors = [{name = "DormDish AI"}]
readme = "README.md"
license = {text =   "MIT"}
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.116.2",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "python-dotenv==1.0.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.20",
    "httpx",
    "requests==2.32.5",
    "bcrypt==4.1.2",
    "supabase",
    "google-genai==1.68.0",
    "PyJWT==2.10.1",
    "email-validator==2.2.0",
    "beautifulsoup4==4.12.3",
]

[project.optional-dependencies]
tests = [
    "pytest>=8.2,<8.3",
    "httpx>=0.28.1,<1.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]