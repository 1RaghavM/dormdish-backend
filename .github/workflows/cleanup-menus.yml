name: Daily Menu Cleanup

on:
  schedule:
    # Run at 4:00 AM EST (9:00 AM UTC) every day
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  cleanup-menus:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install supabase python-dotenv
        
    - name: Clean up previous day menus
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python -c "
        import os
        from datetime import datetime, timedelta, timezone
        from supabase import create_client
        from dotenv import load_dotenv
        
        # Load environment variables
        load_dotenv()
        
        # Get Supabase credentials from environment
        supabase_url = os.getenv('SUPABASE_URL')
        supabase_key = os.getenv('SUPABASE_KEY')
        
        if not supabase_url or not supabase_key:
            print('❌ Supabase credentials not found')
            exit(1)
            
        # Initialize Supabase client
        supabase = create_client(supabase_url, supabase_key)
        
        # Calculate yesterday's date
        yesterday = (datetime.now(timezone.utc) - timedelta(days=1)).strftime('%Y-%m-%d')
        
        try:
            # Delete all menu records from yesterday
            result = supabase.table('menus').delete().eq('date', yesterday).execute()
            
            if result.data:
                deleted_count = len(result.data)
                print(f'✅ Successfully deleted {deleted_count} menu records from {yesterday}')
            else:
                print(f'ℹ️ No menu records found for {yesterday}')
                
        except Exception as e:
            print(f'❌ Error deleting menu records: {e}')
            exit(1)
        "